<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css?v=11081539">
  <title>باص الخير</title>
  <meta property="og:title" content="باص الخير">
  <meta property="og:description" content="شارك في المبادرة">
  <meta property="og:image" content="https://khairbus.com/home/img/share.jpg">
</head>
<body>
  <header class="top">
    <div class="wrap top-in">
      <a class="back" id="back" href="./" aria-label="رجوع"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
      <span class="top-title" id="topTitle"></span>
      <a class="brand" href="./" style="margin-inline-start:auto"><img src="img/logo.png" alt="باص الخير"></a>
    </div>
  </header>

  <main class="wrap">
    <p class="loading" id="loading">جارٍ التحميل…</p>
    <section class="ev-head" id="head" hidden>
      <h1 id="title"></h1>
      <div class="meta" id="meta"></div>
      <div class="progress"><span class="bar"><span class="bar-fill" id="bar"></span></span><span id="pct"></span></div>
      <div class="closed-box" id="closed" hidden></div>
    </section>

    <section class="section" id="boxWrap" hidden>
      <div class="panel-box">
        <p class="box-note" id="boxNote"></p>
        <ul class="box-list" id="boxList"></ul>
      </div>
    </section>

    <section class="section" id="itemsWrap" hidden>
      <h2 id="itemsTitle">المطلوب</h2>
      <ul class="items" id="items"></ul>
    </section>

    <section class="section" id="extraWrap" hidden>
      <h2>شي ثاني؟</h2>
      <div class="panel-box">
        <form class="extra-form" id="extraForm" autocomplete="off">
          <input class="input" id="exItem" autocomplete="off" maxlength="80" placeholder="الصنف" aria-label="الصنف" required>
          <input class="input" id="exQty" type="number" inputmode="numeric" min="1" value="1" aria-label="العدد">
          <button class="btn btn-ghost" type="submit">إضافة</button>
        </form>
        <ul class="tags" id="myExtras"></ul>
        <ul class="tags" id="others"></ul>
      </div>
    </section>

    <section class="section" id="whoWrap" hidden>
      <h2 id="whoTitle">المشاركون</h2>
      <ol class="rows" id="who"></ol>
    </section>
  </main>

  <footer class="bottom" id="bar2" hidden>
    <form class="wrap bottom-form" id="sendForm">
      <input class="input" id="name" autocomplete="name" maxlength="80" placeholder="الاسم" aria-label="الاسم" required>
      <button class="btn btn-primary" type="submit" id="sendBtn" disabled>تأكيد</button>
    </form>
  </footer>

  <section class="sheet" id="thanks" hidden aria-live="polite">
    <div class="sheet-card">
      <div class="sheet-tick"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2 id="thanksTitle"></h2>
      <p id="thanksWhen"></p>
      <ul class="sheet-list" id="thanksList"></ul>
      <button class="btn btn-primary btn-wide" type="button" id="doneBtn">تم</button>
    </div>
  </section>

  <script src="js/config.js?v=11081539"></script>
  <script src="js/store.js?v=11081539"></script>
  <script src="js/ui.js?v=11081539"></script>
  <script src="js/event.js?v=11081539"></script>
</body>
</html>
